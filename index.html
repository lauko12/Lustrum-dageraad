<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dageraad — Live Puntenstand</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --cream:    #fffbf4;
  --cream2:   #fff5e1;
  --gold:     #ffd700;
  --salmon:   #ffa07a;
  --pink:     #f7aeb9;
  --red:      #f12509;
  --lavender: #7d5ba6;
  --navy:     #1a1a40;
  --text:     #1a1a40;
  --muted:    #8a7a6a;
  --border:   rgba(26,26,64,0.12);
  --card:     rgba(255,255,255,0.75);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}

body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Jost', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content:'';position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 110% 50% at 50% -5%, rgba(255,215,0,.28) 0%, transparent 60%),
    radial-gradient(ellipse 80%  40% at 50%  0%, rgba(255,160,122,.2) 0%, transparent 55%),
    radial-gradient(ellipse 60%  30% at 50%  0%, rgba(247,174,185,.15) 0%, transparent 50%);
  pointer-events:none;
}

.wrap {max-width:700px;margin:0 auto;padding:0 20px 100px;position:relative;z-index:1;}

/* ── COUNTDOWN ── */
.countdown-bar {
  display:flex;justify-content:center;gap:0;
  padding:10px 0 0;margin-bottom:4px;
}
.cd-block {
  text-align:center;padding:10px 18px;
  border-right:1px solid var(--border);
}
.cd-block:last-child{border-right:none;}
.cd-num {
  font-family:'Playfair Display',serif;
  font-size:28px;font-weight:900;
  color:var(--navy);line-height:1;
  display:block;
}
.cd-lbl {
  font-size:9px;letter-spacing:2.5px;
  text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-top:3px;display:block;
}

/* ── HERO ── */
.hero{text-align:center;padding-top:28px;}
.sunrise-wrap{position:relative;height:145px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-2px;}
.sunrise-wrap svg{width:440px;max-width:100%;overflow:visible;}

@keyframes rayPulse{0%,100%{opacity:var(--op);}50%{opacity:calc(var(--op)*.5);}}
.ray{animation:rayPulse 4s ease-in-out infinite;}
.ray:nth-child(1){--op:.55;animation-delay:0s;}
.ray:nth-child(2){--op:.48;animation-delay:.3s;}
.ray:nth-child(3){--op:.48;animation-delay:.3s;}
.ray:nth-child(4){--op:.40;animation-delay:.6s;}
.ray:nth-child(5){--op:.40;animation-delay:.6s;}
.ray:nth-child(6){--op:.32;animation-delay:.9s;}
.ray:nth-child(7){--op:.32;animation-delay:.9s;}
.ray:nth-child(8){--op:.24;animation-delay:1.2s;}
.ray:nth-child(9){--op:.24;animation-delay:1.2s;}
.ray:nth-child(10){--op:.18;animation-delay:1.5s;}
.ray:nth-child(11){--op:.18;animation-delay:1.5s;}
.ray:nth-child(12){--op:.12;animation-delay:1.8s;}
.ray:nth-child(13){--op:.12;animation-delay:1.8s;}

.eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500;}
.brand-title{font-family:'Playfair Display',serif;font-size:clamp(48px,12vw,80px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:var(--navy);line-height:1;margin-bottom:6px;}
.brand-sub{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:16px;}

.live-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(26,26,64,.06);border:1px solid rgba(26,26,64,.14);color:var(--navy);padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
.last-updated{font-size:11px;color:var(--muted);margin-bottom:28px;}

.horizon{height:2px;background:linear-gradient(90deg,transparent 0%,var(--salmon) 20%,var(--gold) 50%,var(--salmon) 80%,transparent 100%);margin-bottom:28px;border-radius:2px;}

/* ── TABS ── */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid var(--border);}
.tab-btn{flex:1;background:none;border:none;padding:11px 10px 13px;font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;transition:color .25s;}
.tab-btn::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--salmon),var(--gold));transform:scaleX(0);transition:transform .3s ease;}
.tab-btn.active{color:var(--navy);}
.tab-btn.active::after{transform:scaleX(1);}

.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* ── PODIUM ── */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:28px;}
.pod-col{flex:1;max-width:196px;text-align:center;cursor:pointer;}
.pod-avatar{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:18px;font-weight:900;margin:0 auto 7px;color:#fff;letter-spacing:1px;transition:transform .2s;}
.pod-col:hover .pod-avatar{transform:scale(1.08);}
.pod-gold .pod-avatar{width:64px;height:64px;font-size:22px;background:linear-gradient(135deg,var(--gold),var(--salmon));box-shadow:0 6px 24px rgba(255,160,50,.35);}
.pod-silver .pod-avatar{background:linear-gradient(135deg,#bbb,#888);box-shadow:0 4px 14px rgba(0,0,0,.12);}
.pod-bronze .pod-avatar{background:linear-gradient(135deg,#c8895a,#9a5c30);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.pod-name{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pod-pts{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;line-height:1;margin-bottom:10px;}
.pod-gold .pod-pts{color:var(--gold);}
.pod-silver .pod-pts{color:#999;}
.pod-bronze .pod-pts{color:#c8895a;}
.pod-block{border-radius:6px 6px 0 0;}
.pod-gold .pod-block{height:72px;background:linear-gradient(180deg,rgba(255,215,0,.18),rgba(255,215,0,.05));border:1px solid rgba(255,215,0,.28);border-bottom:none;}
.pod-silver .pod-block{height:48px;background:linear-gradient(180deg,rgba(180,180,180,.12),rgba(180,180,180,.03));border:1px solid rgba(180,180,180,.2);border-bottom:none;}
.pod-bronze .pod-block{height:32px;background:linear-gradient(180deg,rgba(200,137,90,.1),rgba(200,137,90,.02));border:1px solid rgba(200,137,90,.15);border-bottom:none;}

/* ── LEADERBOARD ── */
.section-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.refresh-btn:hover{border-color:var(--salmon);color:var(--salmon);}

.leaderboard{display:flex;flex-direction:column;gap:5px;}
.player-row{display:flex;align-items:center;gap:13px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:13px;padding:13px 16px;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;animation:fadeUp .4s ease both;}
.player-row:hover{transform:translateX(4px);box-shadow:0 4px 20px rgba(255,160,122,.15);border-color:rgba(255,160,122,.35);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--muted);width:28px;text-align:center;flex-shrink:0;}
.p-avatar{width:37px;height:37px;border-radius:50%;background:linear-gradient(135deg,var(--lavender),var(--salmon));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.p-info{flex:1;min-width:0;}
.p-name{font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-acts{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-bar{height:2px;background:rgba(26,26,64,.08);border-radius:2px;margin-top:6px;overflow:hidden;}
.p-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--salmon),var(--gold));transition:width .9s ease;}
.p-score{text-align:right;flex-shrink:0;}
.p-pts{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;line-height:1;color:var(--navy);}
.p-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:500;}

/* ── GRAFIEK ── */
.chart-card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:28px;}
.chart-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:16px;}
.chart-wrap{position:relative;height:220px;}

/* ── BAKTREK ── */
.bak-list{display:flex;flex-direction:column;gap:5px;}
.bak-row{display:flex;align-items:center;gap:14px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:13px;padding:12px 16px;animation:fadeUp .4s ease both;}
.bak-rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--muted);width:28px;text-align:center;flex-shrink:0;}
.bak-name{flex:1;font-size:15px;font-weight:600;color:var(--navy);}
.bak-time{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--navy);}
.bak-record-badge{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--salmon));color:#fff;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:100px;margin-left:8px;vertical-align:middle;}

/* Baktrek video hero */
.bak-video-hero{margin-bottom:24px;}
.bak-video-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
.bak-video-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;color:var(--navy);margin-bottom:12px;}
.bak-video-wrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#000;}
.bak-video-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.bak-video-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;background:rgba(26,26,64,.04);border:2px dashed var(--border);border-radius:16px;color:var(--muted);font-size:13px;gap:8px;}
.bak-video-placeholder .upload-icon{font-size:32px;}

/* Video upload knop */
.bak-upload-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.bak-upload-input{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;background:rgba(255,255,255,.8);color:var(--navy);outline:none;}
.bak-upload-btn{background:linear-gradient(90deg,var(--salmon),var(--gold));color:#fff;border:none;padding:9px 16px;border-radius:8px;font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
.bak-upload-btn:hover{opacity:.85;}
.bak-upload-btn:disabled{opacity:.45;cursor:not-allowed;}
.bak-upload-status{font-size:11px;color:var(--muted);width:100%;text-align:center;}

/* ── FOTO MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(26,26,64,.7);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.open{display:flex;}
.modal{background:var(--cream);border-radius:20px;padding:28px;width:min(500px,94vw);max-height:90vh;overflow-y:auto;position:relative;animation:modalIn .3s ease;}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:none;}}
.modal-close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.modal-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--navy);margin-bottom:4px;}
.modal-score{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:20px;}
.modal-acts-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
.acts-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.act-chip{background:rgba(255,160,122,.12);border:1px solid rgba(255,160,122,.3);color:var(--navy);font-size:12px;padding:5px 10px;border-radius:100px;font-weight:500;}

/* Upload */
.upload-section{border-top:1px solid var(--border);padding-top:20px;margin-top:4px;}
.upload-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:12px;}
.upload-form{display:flex;flex-direction:column;gap:10px;}
.upload-select,.upload-input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-family:'Jost',sans-serif;font-size:13px;background:rgba(255,255,255,.8);color:var(--navy);outline:none;}
.upload-select:focus,.upload-input:focus{border-color:var(--salmon);}
.upload-btn{background:linear-gradient(90deg,var(--salmon),var(--gold));color:#fff;border:none;padding:11px;border-radius:10px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .2s;}
.upload-btn:hover{opacity:.88;}
.upload-btn:disabled{opacity:.5;cursor:not-allowed;}
.upload-status{font-size:12px;color:var(--muted);text-align:center;}

/* Foto grid */
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px;}
.foto-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--border);}
.foto-empty{font-size:12px;color:var(--muted);text-align:center;padding:12px 0;}

/* ── STATES ── */
.state-msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;}
.spinner{width:30px;height:30px;border:2px solid rgba(26,26,64,.1);border-top-color:var(--salmon);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}

footer{text-align:center;margin-top:56px;font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;opacity:.5;}
</style>
</head>
<body>
<div class="wrap">

  <!-- COUNTDOWN -->
  <div class="countdown-bar">
    <div class="cd-block"><span class="cd-num" id="cd-d">--</span><span class="cd-lbl">dagen</span></div>
    <div class="cd-block"><span class="cd-num" id="cd-h">--</span><span class="cd-lbl">uur</span></div>
    <div class="cd-block"><span class="cd-num" id="cd-m">--</span><span class="cd-lbl">min</span></div>
    <div class="cd-block"><span class="cd-num" id="cd-s">--</span><span class="cd-lbl">sec</span></div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="sunrise-wrap">
      <svg viewBox="0 0 440 150" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g>
          <polygon class="ray" points="220,128 204,0  236,0"  fill="#ffd700"/>
          <polygon class="ray" points="220,128 182,5  206,0"  fill="#ffb347"/>
          <polygon class="ray" points="220,128 234,0  258,5"  fill="#ffb347"/>
          <polygon class="ray" points="220,128 160,16 184,4"  fill="#ffa07a"/>
          <polygon class="ray" points="220,128 256,4  280,16" fill="#ffa07a"/>
          <polygon class="ray" points="220,128 134,34 160,14" fill="#f7aeb9"/>
          <polygon class="ray" points="220,128 280,14 306,34" fill="#f7aeb9"/>
          <polygon class="ray" points="220,128 106,58 132,36" fill="#f7aeb9"/>
          <polygon class="ray" points="220,128 308,36 334,58" fill="#f7aeb9"/>
          <polygon class="ray" points="220,128  78,84 104,60" fill="#ffd700"/>
          <polygon class="ray" points="220,128 336,60 362,84" fill="#ffd700"/>
          <polygon class="ray" points="220,128  50,112  76,86" fill="#ffa07a"/>
          <polygon class="ray" points="220,128 364,86 390,112" fill="#ffa07a"/>
        </g>
        <path d="M 116 128 A 104 104 0 0 1 324 128 Z" fill="url(#sg)" opacity=".9"/>
        <line x1="0" y1="128" x2="440" y2="128" stroke="url(#hg)" stroke-width="2"/>
        <defs>
          <radialGradient id="sg" cx="50%" cy="100%" r="50%">
            <stop offset="0%"   stop-color="#ffd700"/>
            <stop offset="55%"  stop-color="#ffa07a"/>
            <stop offset="100%" stop-color="#f7aeb9" stop-opacity=".5"/>
          </radialGradient>
          <linearGradient id="hg" x1="0" y1="0" x2="440" y2="0">
            <stop offset="0%"   stop-color="transparent"/>
            <stop offset="25%"  stop-color="#ffa07a"/>
            <stop offset="50%"  stop-color="#ffd700"/>
            <stop offset="75%"  stop-color="#ffa07a"/>
            <stop offset="100%" stop-color="transparent"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="eyebrow">Yir'at 'Adonay · 2025–2026</div>
    <div class="brand-title">Dageraad</div>
    <div class="brand-sub">XE Lustrum der C.S.F.R. Groningen</div>
    <div class="live-pill"><div class="live-dot"></div>Live</div>
    <div class="last-updated" id="lastUpdated">Laden…</div>
  </div>

  <div class="horizon"></div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active"  data-tab="lustrumweek">Lustrumweek</button>
    <button class="tab-btn"        data-tab="jachtseizoen">Jachtseizoen</button>
    <button class="tab-btn"        data-tab="bakrecord">🏋️ Baktrek</button>
    <button class="tab-btn"        data-tab="grafiek">📈 Grafiek</button>
  </div>

  <div class="tab-pane active" id="tab-lustrumweek">
    <div class="state-msg"><div class="spinner"></div>Laden…</div>
  </div>
  <div class="tab-pane" id="tab-jachtseizoen">
    <div class="state-msg"><div class="spinner"></div>Laden…</div>
  </div>
  <div class="tab-pane" id="tab-bakrecord">
    <div class="state-msg"><div class="spinner"></div>Laden…</div>
  </div>
  <div class="tab-pane" id="tab-grafiek">
    <div class="state-msg"><div class="spinner"></div>Laden…</div>
  </div>

  <footer>✦ Automatisch bijgewerkt elke 30 seconden ✦</footer>
</div>

<!-- FOTO MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-score" id="modal-score"></div>

    <div class="modal-acts-title">Voltooide activiteiten</div>
    <div class="acts-grid" id="modal-acts"></div>

    <div class="upload-section">
      <div class="upload-title">📸 Foto toevoegen</div>
      <div class="upload-form">
        <select class="upload-select" id="upload-act">
          <option value="">— Kies activiteit —</option>
        </select>
        <input class="upload-input" type="file" id="upload-file" accept="image/*">
        <button class="upload-btn" id="upload-btn" onclick="uploadFoto()">Uploaden</button>
        <div class="upload-status" id="upload-status"></div>
      </div>
    </div>

    <div id="modal-fotos" class="foto-grid"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxZzJcu01bo0ykZ_uaYnO2z2N7CPffNchGTgtuTyGbgMVfBQwDcnybpKcWd-gRTghH7/exec';
const EINDE_LUSTRUMWEEK = new Date('2025-05-30T23:59:59+02:00');

// ── STATE ───────────────────────────────────────────────────
let cachedData   = null;
let activeTab    = 'lustrumweek';
let modalPersoon = null;
let grafiekChart = null;

// ── COUNTDOWN ───────────────────────────────────────────────
function tickCountdown() {
  const diff = EINDE_LUSTRUMWEEK - Date.now();
  if (diff <= 0) {
    document.querySelector('.countdown-bar').innerHTML =
      '<div style="font-family:\'Playfair Display\',serif;font-size:22px;font-weight:900;color:var(--navy);padding:12px 0;">🌅 Lustrumweek is voorbij!</div>';
    return;
  }
  const d = Math.floor(diff / 864e5);
  const h = Math.floor((diff % 864e5) / 36e5);
  const m = Math.floor((diff % 36e5) / 6e4);
  const s = Math.floor((diff % 6e4) / 1e3);
  document.getElementById('cd-d').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(s).padStart(2,'0');
}
setInterval(tickCountdown, 1000);
tickCountdown();

// ── HELPERS ─────────────────────────────────────────────────
const initials = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const fmtTime  = iso => iso ? new Date(iso).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
const medals   = {0:'🥇',1:'🥈',2:'🥉'};

// ── TABS ────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + activeTab).classList.add('active');
    if (cachedData) renderActiveTab();
  });
});

function renderActiveTab() {
  if (activeTab === 'lustrumweek')  renderStand('lustrumweek',  cachedData.lustrumweek);
  if (activeTab === 'jachtseizoen') renderStand('jachtseizoen', cachedData.jachtseizoen);
  if (activeTab === 'bakrecord')    renderBaktrek(cachedData.bakrecord);
  if (activeTab === 'grafiek')      renderGrafiek(cachedData.geschiedenis, cachedData.lustrumweek);
}

// ── STAND ───────────────────────────────────────────────────
function renderStand(tabId, data) {
  const el = document.getElementById('tab-' + tabId);
  if (!data?.scores?.length) { el.innerHTML = '<div class="state-msg">Geen data.</div>'; return; }

  const scores = data.scores;
  const maxPts = scores[0].total || 1;

  // Podium: zilver|goud|brons
  const [g, s, b] = scores;
  const podCols = [
    s ? `<div class="pod-col pod-silver" onclick="openModal('${s.name}')"><div class="pod-avatar">${initials(s.name)}</div><div class="pod-name">${s.name.split(' ')[0]}</div><div class="pod-pts">${s.total}</div><div class="pod-block"></div></div>` : '',
    g ? `<div class="pod-col pod-gold"   onclick="openModal('${g.name}')"><div class="pod-avatar">${initials(g.name)}</div><div class="pod-name">${g.name.split(' ')[0]}</div><div class="pod-pts">${g.total}</div><div class="pod-block"></div></div>` : '',
    b ? `<div class="pod-col pod-bronze" onclick="openModal('${b.name}')"><div class="pod-avatar">${initials(b.name)}</div><div class="pod-name">${b.name.split(' ')[0]}</div><div class="pod-pts">${b.total}</div><div class="pod-block"></div></div>` : '',
  ].join('');

  const rows = scores.map((p, i) => {
    const pct  = (p.total / maxPts * 100).toFixed(1);
    const rank = medals[i] ?? (i+1);
    const acts = p.completedActivities?.length ? p.completedActivities.join(' · ') : 'Nog geen activiteiten';
    return `
      <div class="player-row" style="animation-delay:${(i*.04).toFixed(2)}s" onclick="openModal('${p.name}')">
        <div class="rank">${rank}</div>
        <div class="p-avatar">${initials(p.name)}</div>
        <div class="p-info">
          <div class="p-name">${p.name}</div>
          <div class="p-acts">${acts}</div>
          <div class="p-bar"><div class="p-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="p-score">
          <div class="p-pts">${p.total}</div>
          <div class="p-lbl">pts</div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="podium">${podCols}</div>
    <div class="section-bar">
      <div class="section-label">Alle deelnemers</div>
      <button class="refresh-btn" onclick="fetchData()">↻ Vernieuwen</button>
    </div>
    <div class="leaderboard">${rows}</div>`;
}

// ── BAKTREK ─────────────────────────────────────────────────
function renderBaktrek(data) {
  const el = document.getElementById('tab-bakrecord');
  if (!data?.records?.length) {
    el.innerHTML = '<div class="state-msg">Nog geen baktrek records.<br><small>Maak een tabblad "bak record" aan met naam in kolom B en tijd in kolom C.</small></div>';
    return;
  }

  const record = data.records[0];
  const video  = data.video;

  // Video sectie
  let videoHtml;
  if (video?.embedUrl) {
    videoHtml = `
      <div class="bak-video-hero">
        <div class="bak-video-label">🏆 Huidig record — ${record.naam} — ${record.tijd}s</div>
        <div class="bak-video-wrap">
          <iframe src="${video.embedUrl}" allowfullscreen allow="autoplay"></iframe>
        </div>
        <div class="bak-upload-bar">
          <input class="bak-upload-input" type="file" id="bak-video-input" accept="video/*">
          <button class="bak-upload-btn" onclick="uploadBakVideo('${record.naam}')">↑ Nieuw filmpje</button>
          <div class="bak-upload-status" id="bak-upload-status"></div>
        </div>
      </div>`;
  } else {
    videoHtml = `
      <div class="bak-video-hero">
        <div class="bak-video-label">🏆 Huidig record — ${record.naam} — ${record.tijd}s</div>
        <div class="bak-video-placeholder">
          <div class="upload-icon">🎬</div>
          Nog geen filmpje — upload er een!
        </div>
        <div class="bak-upload-bar">
          <input class="bak-upload-input" type="file" id="bak-video-input" accept="video/*">
          <button class="bak-upload-btn" onclick="uploadBakVideo('${record.naam}')">↑ Upload filmpje</button>
          <div class="bak-upload-status" id="bak-upload-status"></div>
        </div>
      </div>`;
  }

  const rows = data.records.map((r, i) => {
    const rank  = medals[i] ?? (i + 1);
    const badge = i === 0 ? '<span class="bak-record-badge">Record</span>' : '';
    return `
      <div class="bak-row" style="animation-delay:${(i * .04).toFixed(2)}s">
        <div class="bak-rank">${rank}</div>
        <div class="bak-name">${r.naam}${badge}</div>
        <div class="bak-time">${r.tijd}s</div>
      </div>`;
  }).join('');

  el.innerHTML = `
    ${videoHtml}
    <div class="section-bar" style="margin-bottom:12px">
      <div class="section-label">Alle tijden</div>
    </div>
    <div class="bak-list">${rows}</div>`;
}

// ── BAKTREK VIDEO UPLOAD ─────────────────────────────────────
async function uploadBakVideo(naam) {
  const input    = document.getElementById('bak-video-input');
  const statusEl = document.getElementById('bak-upload-status');
  const btn      = document.querySelector('.bak-upload-btn');

  if (!input?.files[0]) { statusEl.textContent = 'Kies eerst een filmpje.'; return; }

  const file = input.files[0];
  if (file.size > 100 * 1024 * 1024) { statusEl.textContent = 'Bestand mag max 100 MB zijn.'; return; }

  btn.disabled = true;
  statusEl.textContent = 'Uploaden… (kan even duren bij grote bestanden)';

  try {
    const base64 = await toBase64(file);
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        type:         'bakvideo',
        naam,
        bestandsnaam: file.name,
        base64data:   base64.split(',')[1],
        mimetype:     file.type,
      })
    });
    const data = await res.json();
    if (data.success) {
      statusEl.textContent = '✓ Filmpje geüpload! Vernieuwen om te zien…';
      setTimeout(fetchData, 1500);
    } else {
      statusEl.textContent = 'Fout: ' + data.error;
    }
  } catch(e) {
    statusEl.textContent = 'Upload mislukt. Probeer opnieuw.';
  } finally {
    btn.disabled = false;
  }
}

// ── GRAFIEK ─────────────────────────────────────────────────
function renderGrafiek(geschiedenis, lustrumData) {
  const el = document.getElementById('tab-grafiek');

  if (!geschiedenis?.length) {
    el.innerHTML = '<div class="state-msg">Nog geen historische data.<br><small>Komt automatisch na de eerste dag.</small></div>';
    return;
  }

  el.innerHTML = `
    <div class="chart-card">
      <div class="chart-title">Punten per dag — Lustrumweek</div>
      <div class="chart-wrap"><canvas id="chartCanvas"></canvas></div>
    </div>`;

  const labels = geschiedenis.map(d => d.datum);
  const namen  = lustrumData?.scores?.slice(0, 8).map(p => p.name) || [];

  const palette = ['#ffd700','#ffa07a','#f7aeb9','#7d5ba6','#f12509','#1a1a40','#c8895a','#aaa'];

  const datasets = namen.map((naam, i) => ({
    label: naam,
    data:  geschiedenis.map(d => d[naam] ?? 0),
    borderColor: palette[i % palette.length],
    backgroundColor: palette[i % palette.length] + '22',
    borderWidth: 2,
    pointRadius: 3,
    tension: 0.35,
    fill: false,
  }));

  if (grafiekChart) grafiekChart.destroy();
  grafiekChart = new Chart(document.getElementById('chartCanvas'), {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            font: { family: 'Jost', size: 11 },
            color: '#8a7a6a',
            boxWidth: 12,
          }
        }
      },
      scales: {
        x: { ticks: { font: { family: 'Jost', size: 11 }, color: '#8a7a6a' }, grid: { color: 'rgba(26,26,64,.06)' } },
        y: { ticks: { font: { family: 'Jost', size: 11 }, color: '#8a7a6a' }, grid: { color: 'rgba(26,26,64,.06)' }, beginAtZero: true }
      }
    }
  });
}

// ── MODAL ───────────────────────────────────────────────────
function openModal(naam) {
  modalPersoon = naam;
  document.getElementById('modal-name').textContent = naam;

  // Zoek scores op
  const allScores = [
    ...(cachedData?.lustrumweek?.scores  || []),
    ...(cachedData?.jachtseizoen?.scores || []),
  ];
  const p = allScores.find(s => s.name === naam);
  const lw = cachedData?.lustrumweek?.scores?.find(s => s.name === naam);
  const js = cachedData?.jachtseizoen?.scores?.find(s => s.name === naam);

  const lwPts = lw?.total || 0;
  const jsPts = js?.total || 0;
  document.getElementById('modal-score').textContent =
    `Lustrumweek: ${lwPts} pts  ·  Jachtseizoen: ${jsPts} pts`;

  // Activiteiten chips
  const acts = [...(lw?.completedActivities || []), ...(js?.completedActivities || [])];
  document.getElementById('modal-acts').innerHTML = acts.length
    ? acts.map(a => `<div class="act-chip">${a}</div>`).join('')
    : '<div style="font-size:12px;color:var(--muted)">Nog geen activiteiten</div>';

  // Vul activiteit dropdown
  const allActs = [
    ...(cachedData?.lustrumweek?.activities  || []),
    ...(cachedData?.jachtseizoen?.activities || []),
  ];
  const sel = document.getElementById('upload-act');
  sel.innerHTML = '<option value="">— Kies activiteit —</option>'
    + allActs.map(a => `<option value="${a.name}">${a.name}</option>`).join('');

  // Foto's laden
  loadFotos(naam);

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  modalPersoon = null;
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ── FOTO UPLOAD ─────────────────────────────────────────────
async function uploadFoto() {
  const activiteit  = document.getElementById('upload-act').value;
  const fileInput   = document.getElementById('upload-file');
  const statusEl    = document.getElementById('upload-status');
  const btn         = document.getElementById('upload-btn');

  if (!activiteit)        { statusEl.textContent = 'Kies eerst een activiteit.'; return; }
  if (!fileInput.files[0]){ statusEl.textContent = 'Kies een foto.'; return; }

  const file = fileInput.files[0];
  btn.disabled = true;
  statusEl.textContent = 'Uploaden…';

  try {
    const base64 = await toBase64(file);
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        naam:         modalPersoon,
        activiteit,
        bestandsnaam: file.name,
        base64data:   base64.split(',')[1],
        mimetype:     file.type,
      })
    });
    const data = await res.json();
    if (data.success) {
      statusEl.textContent = '✓ Foto geüpload!';
      fileInput.value = '';
      loadFotos(modalPersoon);
    } else {
      statusEl.textContent = 'Fout: ' + data.error;
    }
  } catch(e) {
    statusEl.textContent = 'Upload mislukt.';
  } finally {
    btn.disabled = false;
  }
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function loadFotos(naam) {
  const container = document.getElementById('modal-fotos');
  container.innerHTML = '<div class="foto-empty">Foto\'s laden…</div>';
  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=fotos&naam=${encodeURIComponent(naam)}`);
    const data = await res.json();
    if (!data.fotos?.length) {
      container.innerHTML = '<div class="foto-empty">Nog geen foto\'s.</div>';
    } else {
      container.innerHTML = data.fotos.map(f =>
        `<img src="${f.url}" alt="${f.activiteit}" title="${f.activiteit}" loading="lazy">`
      ).join('');
    }
  } catch {
    container.innerHTML = '<div class="foto-empty">Kan foto\'s niet laden.</div>';
  }
}

// ── FETCH ───────────────────────────────────────────────────
async function fetchData() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();

    // Normalize: old API returned { scores, lastUpdated }
    // New API returns { lustrumweek: {scores}, jachtseizoen: {scores}, ... }
    if (raw.scores && !raw.lustrumweek) {
      cachedData = {
        lastUpdated:  raw.lastUpdated,
        lustrumweek:  { scores: raw.scores, activities: raw.activities || [] },
        jachtseizoen: { scores: [], activities: [] },
        bakrecord:    { records: [] },
        geschiedenis: [],
      };
    } else {
      cachedData = raw;
    }

    document.getElementById('lastUpdated').textContent =
      'Bijgewerkt om ' + fmtTime(cachedData.lastUpdated);
    renderActiveTab();
  } catch(e) {
    ['lustrumweek','jachtseizoen','bakrecord','grafiek'].forEach(t => {
      document.getElementById('tab-' + t).innerHTML = `
        <div class="state-msg">
          ❌ Kan data niet ophalen.<br>
          <small style="display:block;margin-top:8px">Controleer of de web app correct is gepubliceerd (Anyone).</small>
          <button class="refresh-btn" style="margin-top:16px" onclick="fetchData()">Probeer opnieuw</button>
        </div>`;
    });
  }
}

setInterval(fetchData, 30000);
fetchData();
</script>
