<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dageraad — Live Puntenstand</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --cream:#fffbf4; --gold:#ffd700; --salmon:#ffa07a; --pink:#f7aeb9;
  --red:#f12509; --lavender:#7d5ba6; --navy:#1a1a40; --muted:#8a7a6a;
  --border:rgba(26,26,64,0.12); --card:rgba(255,255,255,0.75);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--navy);font-family:'Jost',sans-serif;min-height:100vh;overflow-x:hidden;}

.side-rays{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.side-rays svg{position:absolute;inset:0;width:100%;height:100%;}
@keyframes sRay{0%,100%{opacity:var(--op)}50%{opacity:calc(var(--op)*.35)}}
.sray{animation:sRay 6s ease-in-out infinite;}
.sray:nth-child(1){--op:.07;animation-delay:0s}.sray:nth-child(2){--op:.055;animation-delay:.6s}
.sray:nth-child(3){--op:.045;animation-delay:1.2s}.sray:nth-child(4){--op:.035;animation-delay:1.8s}
.sray:nth-child(5){--op:.025;animation-delay:2.4s}.sray:nth-child(6){--op:.07;animation-delay:.3s}
.sray:nth-child(7){--op:.055;animation-delay:.9s}.sray:nth-child(8){--op:.045;animation-delay:1.5s}
.sray:nth-child(9){--op:.035;animation-delay:2.1s}.sray:nth-child(10){--op:.025;animation-delay:2.7s}

.wrap{max-width:700px;margin:0 auto;padding:0 20px 100px;position:relative;z-index:1;}

.countdown-bar{display:flex;justify-content:center;padding:10px 0 0;margin-bottom:4px;}
.cd-block{text-align:center;padding:10px 18px;border-right:1px solid var(--border);}
.cd-block:last-child{border-right:none;}
.cd-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--navy);line-height:1;display:block;}
.cd-lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px;display:block;}

.hero{text-align:center;padding-top:28px;}
.sunrise-wrap{position:relative;height:145px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-2px;}
.sunrise-wrap svg{width:440px;max-width:100%;overflow:visible;}
@keyframes rayPulse{0%,100%{opacity:var(--op)}50%{opacity:calc(var(--op)*.5)}}
.ray{animation:rayPulse 4s ease-in-out infinite;}
.ray:nth-child(1){--op:.55;animation-delay:0s}.ray:nth-child(2){--op:.48;animation-delay:.3s}
.ray:nth-child(3){--op:.48;animation-delay:.3s}.ray:nth-child(4){--op:.40;animation-delay:.6s}
.ray:nth-child(5){--op:.40;animation-delay:.6s}.ray:nth-child(6){--op:.32;animation-delay:.9s}
.ray:nth-child(7){--op:.32;animation-delay:.9s}.ray:nth-child(8){--op:.24;animation-delay:1.2s}
.ray:nth-child(9){--op:.24;animation-delay:1.2s}.ray:nth-child(10){--op:.18;animation-delay:1.5s}
.ray:nth-child(11){--op:.18;animation-delay:1.5s}.ray:nth-child(12){--op:.12;animation-delay:1.8s}
.ray:nth-child(13){--op:.12;animation-delay:1.8s}
.eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500;}
.brand-title{font-family:'Playfair Display',serif;font-size:clamp(48px,12vw,80px);font-weight:900;letter-spacing:6px;text-transform:uppercase;color:var(--navy);line-height:1;margin-bottom:6px;}
.brand-sub{font-size:11px;letter-spacing:3.5px;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:16px;}
.live-pill{display:inline-flex;align-items:center;gap:7px;background:rgba(26,26,64,.06);border:1px solid rgba(26,26,64,.14);color:var(--navy);padding:5px 14px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.last-updated{font-size:11px;color:var(--muted);margin-bottom:28px;}
.horizon{height:2px;background:linear-gradient(90deg,transparent,var(--salmon) 20%,var(--gold) 50%,var(--salmon) 80%,transparent);margin-bottom:28px;border-radius:2px;}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-bottom:24px;border-bottom:2px solid var(--border);}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{flex-shrink:0;background:none;border:none;padding:11px 14px 13px;font-family:'Jost',sans-serif;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;transition:color .25s;white-space:nowrap;}
.tab-btn::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--salmon),var(--gold));transform:scaleX(0);transition:transform .3s ease;}
.tab-btn.active{color:var(--navy);}
.tab-btn.active::after{transform:scaleX(1);}
.tab-pane{display:none;}.tab-pane.active{display:block;}

/* AVATAR */
.avatar{border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;color:#fff;flex-shrink:0;}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar span{position:relative;z-index:1;}
.avatar-click{cursor:pointer;transition:transform .2s,box-shadow .2s;border:2px solid transparent;}
.avatar-click:hover{transform:scale(1.12);box-shadow:0 0 0 3px rgba(255,160,122,.5);border-color:var(--salmon);}

/* camera overlay on hover */
.avatar-click::after{content:'📷';position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font-size:13px;background:rgba(26,26,64,.5);border-radius:50%;opacity:0;transition:opacity .2s;}
.avatar-click:hover::after{opacity:1;}

/* PODIUM */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:28px;}
.pod-col{flex:1;max-width:196px;text-align:center;cursor:pointer;}
.pod-avatar{margin:0 auto 7px;transition:transform .2s;}
.pod-gold .pod-avatar{width:64px;height:64px;font-size:22px;background:linear-gradient(135deg,var(--gold),var(--salmon));box-shadow:0 6px 24px rgba(255,160,50,.35);}
.pod-silver .pod-avatar{width:52px;height:52px;font-size:18px;background:linear-gradient(135deg,#bbb,#888);box-shadow:0 4px 14px rgba(0,0,0,.12);}
.pod-bronze .pod-avatar{width:52px;height:52px;font-size:18px;background:linear-gradient(135deg,#c8895a,#9a5c30);box-shadow:0 4px 14px rgba(0,0,0,.1);}
.pod-name{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pod-pts{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;line-height:1;margin-bottom:10px;}
.pod-gold .pod-pts{color:var(--gold);}.pod-silver .pod-pts{color:#999;}.pod-bronze .pod-pts{color:#c8895a;}
.pod-block{border-radius:6px 6px 0 0;}
.pod-gold .pod-block{height:72px;background:linear-gradient(180deg,rgba(255,215,0,.18),rgba(255,215,0,.05));border:1px solid rgba(255,215,0,.28);border-bottom:none;}
.pod-silver .pod-block{height:48px;background:linear-gradient(180deg,rgba(180,180,180,.12),rgba(180,180,180,.03));border:1px solid rgba(180,180,180,.2);border-bottom:none;}
.pod-bronze .pod-block{height:32px;background:linear-gradient(180deg,rgba(200,137,90,.1),rgba(200,137,90,.02));border:1px solid rgba(200,137,90,.15);border-bottom:none;}

/* LEADERBOARD */
.section-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;transition:all .2s;}
.refresh-btn:hover{border-color:var(--salmon);color:var(--salmon);}
.leaderboard{display:flex;flex-direction:column;gap:5px;}
.player-row{display:flex;align-items:center;gap:13px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:13px;padding:13px 16px;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;animation:fadeUp .4s ease both;}
.player-row:hover{transform:translateX(4px);box-shadow:0 4px 20px rgba(255,160,122,.15);border-color:rgba(255,160,122,.35);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--muted);width:28px;text-align:center;flex-shrink:0;}
.row-avatar{width:40px;height:40px;font-size:14px;background:linear-gradient(135deg,var(--lavender),var(--salmon));}
.p-info{flex:1;min-width:0;}
.p-name{font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-acts{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-bar{height:2px;background:rgba(26,26,64,.08);border-radius:2px;margin-top:6px;overflow:hidden;}
.p-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--salmon),var(--gold));transition:width .9s ease;}
.p-score{text-align:right;flex-shrink:0;}
.p-pts{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;line-height:1;color:var(--navy);}
.p-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;font-weight:500;}

/* ============================================================
   PROFIELFOTO MODAL — volledig herbouwd
   ============================================================ */
.overlay{position:fixed;inset:0;background:rgba(26,26,64,.7);z-index:150;display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);}
.overlay.open{display:flex;}
.stat-modal{background:var(--cream);border-radius:22px;padding:28px;width:min(520px,94vw);max-height:92vh;overflow-y:auto;position:relative;animation:mIn .3s ease;}
@keyframes mIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.modal-x{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}
.stat-header{display:flex;align-items:center;gap:18px;margin-bottom:24px;}

/* grote avatar in modal — klikbaar voor foto upload */
.stat-big-av{width:80px;height:80px;font-size:26px;background:linear-gradient(135deg,var(--lavender),var(--salmon));border:3px solid var(--gold);box-shadow:0 4px 20px rgba(255,215,0,.25);cursor:pointer;flex-shrink:0;position:relative;}
.stat-big-av::after{content:'📷';position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(26,26,64,.55);border-radius:50%;opacity:0;transition:opacity .2s;}
.stat-big-av:hover::after{opacity:1;}

.stat-name{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;color:var(--navy);line-height:1;margin-bottom:4px;}
.stat-sub{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-card{background:rgba(255,255,255,.8);border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:center;}
.stat-card.hi{background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,160,122,.08));border-color:rgba(255,215,0,.3);}
.stat-val{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;color:var(--navy);line-height:1;}
.stat-card.hi .stat-val{color:var(--gold);}
.stat-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:500;}
.stat-sec{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:10px;}
.stat-prog-bar{height:8px;background:rgba(26,26,64,.07);border-radius:8px;overflow:hidden;margin-bottom:6px;}
.stat-prog-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--salmon),var(--gold));transition:width 1s ease;}
.stat-prog-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:20px;}
.acts-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
.act-chip{font-size:11px;padding:4px 10px;border-radius:100px;font-weight:500;}
.act-chip.done{background:rgba(255,160,122,.12);border:1px solid rgba(255,160,122,.3);color:var(--navy);}
.act-chip.miss{background:rgba(26,26,64,.04);border:1px solid var(--border);color:var(--muted);text-decoration:line-through;}

/* --- PFP UPLOAD sectie --- */
.pfp-section{border-top:1px solid var(--border);padding-top:20px;margin-top:4px;}
.pfp-drop-zone{position:relative;border:2px dashed rgba(255,160,122,.45);border-radius:16px;padding:28px 20px;text-align:center;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.5);}
.pfp-drop-zone:hover,.pfp-drop-zone.drag-over{border-color:var(--salmon);background:rgba(255,160,122,.06);}
.pfp-drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.pfp-drop-icon{font-size:36px;margin-bottom:8px;display:block;}
.pfp-drop-txt{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:4px;}
.pfp-drop-sub{font-size:12px;color:var(--muted);}

/* preview staat NAAST de zone als foto gekozen */
.pfp-preview-row{display:flex;align-items:center;gap:16px;margin-top:14px;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:14px;padding:14px 16px;}
.pfp-preview-thumb{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;}
.pfp-preview-info{flex:1;min-width:0;}
.pfp-preview-name{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pfp-preview-size{font-size:11px;color:var(--muted);margin-top:2px;}
.pfp-preview-remove{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px;transition:color .2s;}
.pfp-preview-remove:hover{color:var(--red);}

.pfp-save-btn{width:100%;margin-top:14px;background:linear-gradient(90deg,var(--salmon),var(--gold));color:#fff;border:none;padding:13px;border-radius:12px;font-family:'Jost',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:opacity .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;}
.pfp-save-btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.pfp-save-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.pfp-status{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:18px;font-weight:500;}
.pfp-status.ok{color:#2e7d32;}
.pfp-status.err{color:var(--red);}

/* progress bar voor upload */
.pfp-progress{height:4px;background:rgba(26,26,64,.08);border-radius:4px;overflow:hidden;margin-top:10px;display:none;}
.pfp-progress-fill{height:100%;background:linear-gradient(90deg,var(--salmon),var(--gold));border-radius:4px;width:0%;transition:width .3s ease;}

/* BAKTREK */
.bak-list{display:flex;flex-direction:column;gap:5px;}
.bak-row{display:flex;align-items:center;gap:14px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:13px;padding:12px 16px;animation:fadeUp .4s ease both;}
.bak-rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--muted);width:28px;text-align:center;flex-shrink:0;}
.bak-name{flex:1;font-size:15px;font-weight:600;color:var(--navy);}
.bak-time{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--navy);}
.bak-badge{display:inline-block;background:linear-gradient(90deg,var(--gold),var(--salmon));color:#fff;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:100px;margin-left:8px;vertical-align:middle;}

/* Video hero voor baktrek */
.bak-video-hero{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.bak-vid-header{padding:16px 20px 12px;display:flex;align-items:center;gap:10px;}
.bak-vid-header-icon{font-size:24px;}
.bak-vid-header-info{flex:1;}
.bak-vid-header-title{font-size:13px;font-weight:600;color:var(--navy);}
.bak-vid-header-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.bak-vid-container{position:relative;width:100%;background:#0a0a14;}
.bak-vid-container video{width:100%;display:block;max-height:380px;object-fit:contain;}
.bak-vid-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:8px;}
.bak-vid-placeholder-icon{font-size:48px;opacity:.4;}

/* Upload zone voor baktrek video */
.bak-upload-card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;}
.bak-upload-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px;}
.bak-drop-zone{position:relative;border:2px dashed rgba(255,160,122,.4);border-radius:14px;padding:24px 20px;text-align:center;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.4);}
.bak-drop-zone:hover,.bak-drop-zone.drag-over{border-color:var(--salmon);background:rgba(255,160,122,.05);}
.bak-drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.bak-drop-icon{font-size:32px;margin-bottom:6px;display:block;}
.bak-drop-txt{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.bak-drop-sub{font-size:11px;color:var(--muted);}
.bak-file-preview{display:none;align-items:center;gap:12px;margin-top:12px;background:rgba(255,255,255,.7);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
.bak-file-preview.show{display:flex;}
.bak-file-icon{font-size:28px;flex-shrink:0;}
.bak-file-info{flex:1;min-width:0;}
.bak-file-name{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bak-file-size{font-size:11px;color:var(--muted);margin-top:2px;}
.bak-file-remove{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;transition:color .2s;}
.bak-file-remove:hover{color:var(--red);}
.bak-select-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.bak-select{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:'Jost',sans-serif;font-size:12px;background:rgba(255,255,255,.8);color:var(--navy);outline:none;transition:border-color .2s;}
.bak-select:focus{border-color:var(--salmon);}
.bak-upload-btn{background:linear-gradient(90deg,var(--salmon),var(--gold));color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:'Jost',sans-serif;font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity .2s,transform .1s;display:flex;align-items:center;gap:6px;}
.bak-upload-btn:hover:not(:disabled){opacity:.85;transform:translateY(-1px);}
.bak-upload-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.bak-progress{height:4px;background:rgba(26,26,64,.08);border-radius:4px;overflow:hidden;margin-top:12px;display:none;}
.bak-progress-fill{height:100%;background:linear-gradient(90deg,var(--salmon),var(--gold));border-radius:4px;width:0%;transition:width .3s ease;}
.bak-status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:18px;font-weight:500;}
.bak-status.ok{color:#2e7d32;}
.bak-status.err{color:var(--red);}

/* GRAFIEK */
.chart-card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:20px;}
.chart-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:16px;}
.chart-wrap{position:relative;height:220px;}

/* FOTOMUUR */
.foto-upload-card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;}
.foto-muur-grid{columns:2;gap:8px;}
@media(min-width:480px){.foto-muur-grid{columns:3;}}
.fmuur-item{break-inside:avoid;margin-bottom:8px;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;}
.fmuur-item img{width:100%;display:block;border-radius:12px;transition:transform .3s ease;}
.fmuur-item:hover img{transform:scale(1.04);}
.fmuur-cap{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(0deg,rgba(26,26,64,.75),transparent);color:#fff;font-size:11px;font-weight:500;opacity:0;transition:opacity .2s;}
.fmuur-item:hover .fmuur-cap{opacity:1;}
.fmuur-empty{text-align:center;padding:60px 20px;color:var(--muted);}
.fmuur-empty-icon{font-size:40px;margin-bottom:12px;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(10,10,20,.92);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);}
.lightbox.open{display:flex;}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;object-fit:contain;}
.lb-close{position:absolute;top:20px;right:24px;background:none;border:none;color:#fff;font-size:28px;cursor:pointer;opacity:.7;transition:opacity .2s;}
.lb-close:hover{opacity:1;}
.lb-cap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.7);font-size:12px;letter-spacing:1px;white-space:nowrap;}

/* PROGRAMMA */
.prog-day{margin-bottom:28px;}
.prog-day-hdr{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.prog-day-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--gold),var(--salmon));}
.prog-day-lbl{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--navy);}
.prog-day-date{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.prog-items{display:flex;flex-direction:column;gap:6px;}
.prog-item{display:flex;align-items:center;gap:14px;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:12px 16px;animation:fadeUp .4s ease both;position:relative;overflow:hidden;}
.prog-item.now{border-color:rgba(255,160,122,.5);background:rgba(255,215,0,.06);}
.prog-item.now::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--salmon));}
.prog-time{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--navy);width:48px;flex-shrink:0;text-align:right;}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--salmon);flex-shrink:0;}
.prog-item.now .prog-dot{background:var(--gold);box-shadow:0 0 6px rgba(255,215,0,.6);}
.prog-info{flex:1;min-width:0;}
.prog-ttl{font-size:14px;font-weight:600;color:var(--navy);}
.prog-loc{font-size:11px;color:var(--muted);margin-top:2px;}
.prog-now-badge{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--gold);background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.3);padding:2px 8px;border-radius:100px;flex-shrink:0;}

/* WIEL */
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;padding:8px 0;}
.wheel-canvas-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.wheel-pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--navy);z-index:10;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
#wheelCanvas{border-radius:50%;box-shadow:0 8px 40px rgba(26,26,64,.18),0 0 0 4px white,0 0 0 6px var(--border);display:block;}
.wheel-spin-btn{background:linear-gradient(135deg,var(--navy),var(--lavender));color:#fff;border:none;padding:14px 40px;border-radius:100px;font-family:'Playfair Display',serif;font-size:18px;font-weight:900;letter-spacing:1px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 20px rgba(26,26,64,.25);}
.wheel-spin-btn:hover{transform:scale(1.04);box-shadow:0 6px 28px rgba(26,26,64,.3);}
.wheel-spin-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.wheel-result{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;color:var(--navy);text-align:center;min-height:40px;}
.wheel-result span{color:var(--salmon);}
.wheel-members-card{width:100%;background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:16px;padding:18px;}
.wheel-members-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.wheel-toggle-all{background:none;border:1px solid var(--border);color:var(--muted);font-family:'Jost',sans-serif;font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .2s;}
.wheel-toggle-all:hover{border-color:var(--salmon);color:var(--salmon);}
.wheel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;}
.wheel-chip{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:100px;border:1px solid var(--border);background:rgba(255,255,255,.6);cursor:pointer;transition:all .18s;font-size:12px;font-weight:500;color:var(--navy);user-select:none;}
.wheel-chip.active{background:linear-gradient(90deg,rgba(255,160,122,.15),rgba(255,215,0,.1));border-color:rgba(255,160,122,.5);}
.wheel-chip .chip-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .18s;}
.wheel-chip.active .chip-dot{background:var(--salmon);}
.wheel-count{font-size:11px;color:var(--muted);text-align:center;margin-top:10px;}

/* STATES */
.state-msg{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;}
.spinner{width:30px;height:30px;border:2px solid rgba(26,26,64,.1);border-top-color:var(--salmon);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg)}}
footer{text-align:center;margin-top:56px;font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;opacity:.5;}

/* upload-zone herbruikbaar */
.upload-zone{position:relative;border:2px dashed rgba(255,160,122,.4);border-radius:14px;padding:22px 20px;text-align:center;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.4);}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--salmon);background:rgba(255,160,122,.05);}
.upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-zone-icon{font-size:30px;margin-bottom:6px;display:block;}
.upload-zone-txt{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:3px;}
.upload-zone-sub{font-size:11px;color:var(--muted);}
.upload-action-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.upload-action-row select{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-family:'Jost',sans-serif;font-size:12px;background:rgba(255,255,255,.8);color:var(--navy);outline:none;}
.upload-btn{background:linear-gradient(90deg,var(--salmon),var(--gold));color:#fff;border:none;padding:9px 18px;border-radius:8px;font-family:'Jost',sans-serif;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity .2s;}
.upload-btn:hover{opacity:.85;}.upload-btn:disabled{opacity:.45;cursor:not-allowed;}
.upload-status{font-size:11px;color:var(--muted);width:100%;text-align:center;margin-top:6px;}
.upload-preview{max-width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;display:none;}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
const APPS_SCRIPT_URL   = 'https://script.google.com/macros/s/AKfycbwW1TviskfXuJNQGxkz_dpdjna0Gb0_KPVuqGjpVYraaiWhXRxRy495bA3Wx3pCw5Y8/exec';
const EINDE_LUSTRUMWEEK = new Date('2026-05-21T00:00:00+02:00');

let cachedData    = null;
let activeTab     = 'lustrumweek';
let statPersoon   = null;
let pfpFileData   = null;   // { dataUrl, mimetype, bestandsnaam, size }
let grafiekChart  = null;
let wheelSpinning = false;
let wheelSelected = new Set();
let wheelAngle    = 0;
const pfpCache    = {};     // naam -> url

// ============================================================
// COUNTDOWN
// ============================================================
function tickCD() {
  const d = EINDE_LUSTRUMWEEK - Date.now();
  if (d <= 0) {
    document.getElementById('countdown-bar').innerHTML =
      '<div style="font-family:\'Playfair Display\',serif;font-size:22px;font-weight:900;padding:12px 0;text-align:center">🌅 De dageraad is aangebroken!</div>';
    return;
  }
  const dagen = Math.floor(d / 864e5);
  const uren  = Math.floor((d % 864e5) / 36e5);
  const min   = Math.floor((d % 36e5) / 6e4);
  const sec   = Math.floor((d % 6e4) / 1e3);
  document.getElementById('cd-d').textContent = String(dagen).padStart(2,'0');
  document.getElementById('cd-h').textContent = String(uren).padStart(2,'0');
  document.getElementById('cd-m').textContent = String(min).padStart(2,'0');
  document.getElementById('cd-s').textContent = String(sec).padStart(2,'0');
}
setInterval(tickCD, 1000);
tickCD();

// ============================================================
// HELPERS
// ============================================================
const ini  = n => n.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
const fmt  = iso => iso ? new Date(iso).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
const meds = {0:'🥇',1:'🥈',2:'🥉'};
const fmtBytes = b => b < 1024*1024 ? (b/1024).toFixed(0)+' KB' : (b/1024/1024).toFixed(1)+' MB';
const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });

function avEl(naam, extraCls='', w=40, fs=14) {
  const url = pfpCache[naam];
  return `<div class="avatar ${extraCls}" data-naam="${naam}" style="width:${w}px;height:${w}px;font-size:${fs}px">
    ${url ? `<img src="${url}" alt="${naam}">` : ''}
    <span${url ? ' style="display:none"' : ''}>${ini(naam)}</span>
  </div>`;
}

// ============================================================
// TABS
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + activeTab).classList.add('active');
    if (activeTab === 'programma') { renderProgramma(); return; }
    if (activeTab === 'fotomuur')  { renderFotomuur();  return; }
    if (activeTab === 'wiel' && cachedData) { renderWiel(); return; }
    if (cachedData) renderActiveTab();
  });
});

function renderActiveTab() {
  if (activeTab === 'lustrumweek')  renderStand('lustrumweek',  cachedData.lustrumweek);
  if (activeTab === 'jachtseizoen') renderStand('jachtseizoen', cachedData.jachtseizoen);
  if (activeTab === 'bakrecord')    renderBaktrek(cachedData.bakrecord);
  if (activeTab === 'grafiek')      renderGrafiek(cachedData.geschiedenis, cachedData.lustrumweek);
  if (activeTab === 'fotomuur')     renderFotomuur();
  if (activeTab === 'programma')    renderProgramma();
  if (activeTab === 'wiel')         renderWiel();
}

// ============================================================
// STAND / LEADERBOARD
// ============================================================
function renderStand(tabId, data) {
  const el = document.getElementById('tab-' + tabId);
  if (!data?.scores?.length) { el.innerHTML = '<div class="state-msg">Geen data.</div>'; return; }
  const scores = data.scores, maxPts = scores[0].total || 1;
  const [g, s, b] = scores;

  const pod = (p, cls, w, fs) => !p ? '' :
    `<div class="pod-col ${cls}" onclick="openStatModal('${p.name}')">
      ${avEl(p.name, 'pod-avatar', w, fs)}
      <div class="pod-name">${p.name.split(' ')[0]}</div>
      <div class="pod-pts">${p.total}</div>
      <div class="pod-block"></div>
    </div>`;
}
  const podHtml = [pod(s,'pod-silver',52,18), pod(g,'pod-gold',64,22), pod(b,'pod-bronze',52,18)].join('');

  const rows = scores.map((p, i) => {
    const pct  = (p.total / maxPts * 100).toFixed(1);
    const acts = p.completedActivities?.length ? p.completedActivities.join(' · ') : 'Nog geen activiteiten';
    return `<div class="player-row" style="animation-delay:${(i*.04).toFixed(2)}s" onclick="openStatModal('${p.name}')">

        <div class="p-name">${p.name}</div>
        <div class="p-acts">${acts}</div>
        <div class="p-bar"><div class="p-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="p-score"><div class="p-pts">${p.total}</div><div class="p-lbl">pts</div></div>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="podium">${podHtml}</div>
    <div class="section-bar">
      <div class="section-label">Alle deelnemers</div>
      <button class="refresh-btn" onclick="fetchData()">↻ Vernieuwen</button>
    </div>
    <div class="leaderboard">${rows}</div>`;


// ============================================================
// STATISTIEKEN MODAL
// ============================================================
function openStatModal(naam, scrollPfp = false) {
  statPersoon = naam;
  clearPfpPick();

  // Grote avatar
  const av = document.getElementById('stat-av');
  av.dataset.naam = naam;
  const pfpUrl = pfpCache[naam];
  av.innerHTML = pfpUrl
    ? `<img src="${pfpUrl}" alt="${naam}"><span style="display:none">${ini(naam)}</span>`
    : `<span>${ini(naam)}</span>`;

  document.getElementById('stat-name').textContent    = naam;

  const lw  = cachedData?.lustrumweek?.scores  || [];
  const js  = cachedData?.jachtseizoen?.scores || [];
  const lwP = lw.find(p => p.name === naam) || {total:0, completedActivities:[]};
  const jsP = js.find(p => p.name === naam) || {total:0, completedActivities:[]};
  const lwR = lw.findIndex(p => p.name === naam) + 1 || '—';
  const jsR = js.findIndex(p => p.name === naam) + 1 || '—';
  const lwL = lw[0]?.total || 1;
  const allActs = cachedData?.lustrumweek?.activities || [];

  document.getElementById('stat-sub').textContent = `#${lwR} Lustrumweek  ·  #${jsR} Jachtseizoen`;
  document.getElementById('stat-cards').innerHTML = `
    <div class="stat-card hi"><div class="stat-val">${lwP.total}</div><div class="stat-lbl">Lustrumweek pts</div></div>
    <div class="stat-card"><div class="stat-val">${jsP.total}</div><div class="stat-lbl">Jachtseizoen pts</div></div>
    <div class="stat-card"><div class="stat-val">#${lwR}</div><div class="stat-lbl">Positie</div></div>
    <div class="stat-card"><div class="stat-val">${lwP.completedActivities.length}/${allActs.length}</div><div class="stat-lbl">Activiteiten</div></div>`;

  const pct = Math.round((lwP.total / lwL) * 100);
  document.getElementById('stat-prog').style.width = pct + '%';
  document.getElementById('stat-prog-l').textContent = lwP.total + ' pts';
  document.getElementById('stat-prog-r').textContent = lwL + ' pts (#1)';

  const done = new Set(lwP.completedActivities);
  document.getElementById('stat-acts').innerHTML = allActs.map(a =>
    `<div class="act-chip ${done.has(a.name)?'done':'miss'}">${done.has(a.name)?'✓ ':''}${a.name}</div>`
  ).join('') || '<span style="font-size:12px;color:var(--muted)">Geen activiteiten</span>';

  document.getElementById('stat-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  if (scrollPfp) {
    setTimeout(() => document.querySelector('.pfp-section')?.scrollIntoView({behavior:'smooth', block:'center'}), 350);
  }
}

function closeStatModal() {
  document.getElementById('stat-overlay').classList.remove('open');
  document.body.style.overflow = '';
  statPersoon = null;
  clearPfpPick();
}
document.getElementById('stat-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('stat-overlay')) closeStatModal();
});

// ============================================================
// PROFIELFOTO — PICK / PREVIEW / SAVE
// ============================================================
function triggerPfpPick() {
  document.getElementById('pfp-input').click();
}

function onPfpFileChosen(input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    setPfpStatus('Bestand is te groot (max 5 MB).', 'err');
    return;
  }

  const reader = new FileReader();
  reader.onload = e => {
    pfpFileData = { dataUrl: e.target.result, mimetype: file.type, bestandsnaam: file.name, size: file.size };

    // Toon preview
    document.getElementById('pfp-thumb').src            = e.target.result;
    document.getElementById('pfp-preview-name').textContent = file.name;
    document.getElementById('pfp-preview-size').textContent = fmtBytes(file.size);
    document.getElementById('pfp-preview-row').style.display = 'flex';

    // Update grote avatar in modal header direct
    const av = document.getElementById('stat-av');
    av.innerHTML = `<img src="${e.target.result}" alt="preview"><span style="display:none">${ini(statPersoon)}</span>`;

    document.getElementById('pfp-save-btn').disabled = false;
    setPfpStatus('');
  };
  reader.readAsDataURL(file);
}

function clearPfpPick() {
  pfpFileData = null;
  const inp = document.getElementById('pfp-input');
  if (inp) inp.value = '';
  const row = document.getElementById('pfp-preview-row');
  if (row) row.style.display = 'none';
  const btn = document.getElementById('pfp-save-btn');
  if (btn) btn.disabled = true;
  const prog = document.getElementById('pfp-progress');
  if (prog) prog.style.display = 'none';
  setPfpStatus('');
}

function setPfpStatus(msg, cls='') {
  const el = document.getElementById('pfp-status');
  if (!el) return;
  el.textContent = msg;
  el.className   = 'pfp-status' + (cls ? ' '+cls : '');
}

function setPfpProgress(pct) {
  const bar  = document.getElementById('pfp-progress');
  const fill = document.getElementById('pfp-progress-fill');
  if (!bar || !fill) return;
  bar.style.display = pct > 0 && pct < 100 ? 'block' : 'none';
  fill.style.width  = pct + '%';
}

async function savePfp() {
  if (!pfpFileData || !statPersoon) return;
  const btn  = document.getElementById('pfp-save-btn');
  const icon = document.getElementById('pfp-save-icon');
  btn.disabled = true;
  icon.textContent = '⏳';
  setPfpStatus('Uploaden…');
  setPfpProgress(10);

  try {
    const base64data = pfpFileData.dataUrl.split(',')[1];
    setPfpProgress(30);

    const payload = JSON.stringify({
      type: 'profielfoto',
      naam: statPersoon,
      bestandsnaam: pfpFileData.bestandsnaam,
      base64data,
      mimetype: pfpFileData.mimetype
    });

    setPfpProgress(50);
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: payload
    });
    setPfpProgress(85);
    const d = await res.json();
    setPfpProgress(100);

    if (d.success) {
      // Sla URL op in cache
      const url = `https://lh3.googleusercontent.com/d/${d.fileId}`;
      pfpCache[statPersoon] = url;

      // Update alle avatars op de pagina
      document.querySelectorAll(`[data-naam="${statPersoon}"]`).forEach(el => {
        el.innerHTML = `<img src="${url}" alt="${statPersoon}"><span style="display:none">${ini(statPersoon)}</span>`;
      });

      setPfpStatus('✓ Foto opgeslagen!', 'ok');
      icon.textContent = '✓';
      setTimeout(closeStatModal, 1200);
    } else {
      throw new Error(d.error || 'Onbekende fout');
    }
  } catch(e) {
    setPfpStatus('Upload mislukt: ' + e.message, 'err');
    icon.textContent = '💾';
    btn.disabled = false;
    setPfpProgress(0);
  }
}

// Drag & drop voor pfp zone
(function(){
  const zone = document.getElementById('pfp-drop-zone');
  if (!zone) return;
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) {
      const inp = document.getElementById('pfp-input');
      const dt  = new DataTransfer();
      dt.items.add(f);
      inp.files = dt.files;
      onPfpFileChosen(inp);
    }
  });
})();

function renderGrafiek(gesch, lwData) {
  const el = document.getElementById('tab-grafiek');
  if (!gesch?.length) {
    el.innerHTML = '<div class="state-msg">Nog geen historische data.<br><small>Komt automatisch na de eerste dag.</small></div>';

  }
  el.innerHTML = `<div class="chart-card"><div class="chart-title">Punten per dag — Lustrumweek</div><div class="chart-wrap"><canvas id="chartCanvas"></canvas></div></div>`;
  const labels   = gesch.map(d => d.datum);
  const namen    = lwData?.scores?.slice(0,8).map(p => p.name) || [];
  const pal      = ['#ffd700','#ffa07a','#f7aeb9','#7d5ba6','#f12509','#1a1a40','#c8895a','#aaa'];
  const datasets = namen.map((n,i) => ({
    label: n, data: gesch.map(d => d[n] ?? 0),

    borderWidth:2, pointRadius:3, tension:.35, fill:false
  }));
  if (grafiekChart) grafiekChart.destroy();
  grafiekChart = new Chart(document.getElementById('chartCanvas'), {
    type:'line', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{font:{family:'Jost',size:11},color:'#8a7a6a',boxWidth:12}}},
      scales:{
        x:{ticks:{font:{family:'Jost',size:11},color:'#8a7a6a'},grid:{color:'rgba(26,26,64,.06)'}},
        y:{ticks:{font:{family:'Jost',size:11},color:'#8a7a6a'},grid:{color:'rgba(26,26,64,.06)'},beginAtZero:true}
      }
    }
  });
}

let fotoFile = null;

async function renderFotomuur() {
  const el = document.getElementById('tab-fotomuur');
  el.innerHTML = '<div class="state-msg"><div class="spinner"></div>Foto\'s laden…</div>';

  const namen = [...new Set([
    ...(cachedData?.lustrumweek?.scores  || []),
    ...(cachedData?.jachtseizoen?.scores || [])
  ].map(p => p.name))];

  const uploadCard = `
    <div class="foto-upload-card">
      <div class="section-label" style="margin-bottom:14px">📸 Foto uploaden</div>
      <div class="upload-zone" onclick="document.getElementById('foto-file-in').click()">
        <input type="file" id="foto-file-in" accept="image/*,video/*" style="display:none" onchange="fotoPreview(this)">
        <span class="upload-zone-icon">🖼️</span>
        <div class="upload-zone-txt" id="foto-zone-txt">Klik om foto te kiezen</div>
        <div class="upload-zone-sub">JPG, PNG, WEBP · max 10 MB</div>
      </div>
      <img id="foto-preview-img" class="upload-preview" alt="preview">
      <div class="upload-action-row" style="margin-top:10px">
        <select id="foto-naam-sel"><option value="">— Naam —</option>${namen.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
        <select id="foto-act-sel">
          <option value="">— Activiteit —</option>
          ${(cachedData?.lustrumweek?.activities||[]).map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}
          <option value="Overig">Overig</option>
        </select>
        <button class="upload-btn" id="foto-upload-btn" onclick="uploadFoto()" disabled>↑ Uploaden</button>
      </div>
      <div class="upload-status" id="foto-st"></div>
    </div>`;

  try {
    const res  = await fetch(`${APPS_SCRIPT_URL}?action=allfotos`);
    const data = await res.json();
    const grid = data.fotos?.length
      ? `<div class="section-bar" style="margin-bottom:12px">
           <div class="section-label">${data.fotos.length} foto's</div>
           <button class="refresh-btn" onclick="renderFotomuur()">↻</button>
         </div>
         <div class="foto-muur-grid">
           ${data.fotos.map(f=>`
             <div class="fmuur-item" onclick="openLb('${f.url}','${f.naam} · ${f.activiteit||''}')">
               <img src="${f.url}" alt="${f.naam}" loading="lazy">
               <div class="fmuur-cap">${f.naam}${f.activiteit?' · '+f.activiteit:''}</div>
             </div>`).join('')}
         </div>`
      : `<div class="fmuur-empty"><div class="fmuur-empty-icon">📷</div>Nog geen foto's.<br><small>Upload de eerste hierboven!</small></div>`;
    el.innerHTML = uploadCard + grid;
  } catch(e) {
    el.innerHTML = uploadCard + '<div class="state-msg">❌ Kan foto\'s niet laden.</div>';
  }

  ['foto-naam-sel','foto-act-sel'].forEach(id =>
    document.getElementById(id)?.addEventListener('change', checkFotoReady)
  );
}

function fotoPreview(input) {
  if (!input.files[0]) return;
  fotoFile = input.files[0];
  document.getElementById('foto-zone-txt').textContent = fotoFile.name;
  const reader = new FileReader();
  reader.onload = e => {
    const prev = document.getElementById('foto-preview-img');
    prev.src = e.target.result;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(fotoFile);
  checkFotoReady();
}
function checkFotoReady() {
  const btn  = document.getElementById('foto-upload-btn');
  const naam = document.getElementById('foto-naam-sel')?.value;
  const act  = document.getElementById('foto-act-sel')?.value;
  if (btn) btn.disabled = !(fotoFile && naam && act);
}
async function uploadFoto() {
  const naam = document.getElementById('foto-naam-sel')?.value;
  const act  = document.getElementById('foto-act-sel')?.value;
  const st   = document.getElementById('foto-st');
  const btn  = document.getElementById('foto-upload-btn');
  if (!fotoFile || !naam || !act) { if(st) st.textContent='Kies naam, activiteit én foto.'; return; }
  if (fotoFile.size > 100*1024*1024) { if(st) st.textContent='Max 10 MB.'; return; }
  btn.disabled = true; st.textContent = 'Uploaden…';
  try {
    const b64 = await toB64(fotoFile);
    const payload = JSON.stringify({ type:'foto', naam, activiteit:act, bestandsnaam:fotoFile.name, base64data:b64.split(',')[1], mimetype:fotoFile.type });
    const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:payload });
    const d = await res.json();
    if (d.success) { st.textContent='✓ Foto geüpload!'; fotoFile=null; setTimeout(renderFotomuur,1200); }
    else { st.textContent='Fout: '+(d.error||'onbekend'); btn.disabled=false; }
  } catch(e) { st.textContent='Upload mislukt: '+e.message; btn.disabled=false; }
}

function openLb(url, cap) {
  document.getElementById('lb-img').src = url;
  document.getElementById('lb-cap').textContent = cap;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

  {dag:'Maandag',  datum:'25 mei',items:[{tijd:'',titel:'GLOW IN DE DAGERAAD',locatie:''}]},
  {dag:'Dinsdag',  datum:'26 mei',items:[{tijd:'',titel:'BRALLEN TOT DE ZON OPKOMT',locatie:''}]},
  {dag:'Woensdag', datum:'27 mei',items:[{tijd:'',titel:'LUSTRUMRECEPTIE',locatie:''}]},
  {dag:'Donderdag',datum:'28 mei',items:[{tijd:'',titel:'GLOREND BRALLEN',locatie:''},{tijd:'',titel:'AURORA OPEN AIR',locatie:''}]},
  {dag:'Vrijdag',  datum:'29 mei',items:[{tijd:'',titel:'LUSTRUMGALA',locatie:''}]},
  {dag:'Zaterdag', datum:'30 mei',items:[{tijd:'',titel:'ALS DE MORGEN IS GEKOMEN',locatie:''}]},
];
function renderProgramma() {
  const el  = document.getElementById('tab-programma');
  const now = new Date();
  el.innerHTML = PROGRAMMA.map(dag => {
    const items = dag.items.map((item,ii) => {
      const [h=0,m=0] = item.tijd ? item.tijd.split(':').map(Number) : [0,0];
      const iM  = h*60+m;
      const ni  = dag.items[ii+1];
      const nM  = ni ? ni.tijd.split(':').map((v,j)=>j===0?Number(v)*60:Number(v)).reduce((a,b)=>a+b,0) : iM+180;
      const nM2 = now.getHours()*60+now.getMinutes();
      const isNow = item.tijd && nM2>=iM && nM2<nM;
      return `<div class="prog-item${isNow?' now':''}" style="animation-delay:${(ii*.05).toFixed(2)}s">
        ${item.tijd ? `<div class="prog-time">${item.tijd}</div>` : '<div class="prog-time" style="opacity:.3">—</div>'}
        <div class="prog-dot"></div>
        <div class="prog-info">
          <div class="prog-ttl">${item.titel}</div>
          ${item.locatie ? `<div class="prog-loc">📍 ${item.locatie}</div>` : ''}
        </div>
        ${isNow ? '<div class="prog-now-badge">Nu bezig</div>' : ''}
      </div>`;
    }).join('');
    return `<div class="prog-day">
      <div class="prog-day-hdr">
        <div class="prog-day-dot"></div>
        <div><div class="prog-day-lbl">${dag.dag}</div><div class="prog-day-date">${dag.datum}</div></div>
      </div>
      <div class="prog-items">${items}</div>
    </div>`;
  }).join('');
}

// ============================================================
// WIEL — dageRAD
// ============================================================
const WK = ['#ffd700','#ffa07a','#f7aeb9','#7d5ba6','#f12509','#1a1a40','#c8895a','#88c0d0','#a3be8c','#ebcb8b','#bf616a','#d08770'];

function renderWiel() {
  const el = document.getElementById('tab-wiel');
  const namen = [...new Set([
    ...(cachedData?.lustrumweek?.scores  || []),
    ...(cachedData?.jachtseizoen?.scores || [])
  ].map(p => p.name))];
  if (wheelSelected.size === 0) namen.forEach(n => wheelSelected.add(n));
  el.innerHTML = `<div class="wheel-wrap">
    <div class="wheel-result" id="wheel-result"></div>
    <div class="wheel-canvas-wrap">
      <div class="wheel-pointer"></div>
      <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>
    <button class="wheel-spin-btn" id="wheel-spin-btn" onclick="spinWiel()">🌅 Draaien!</button>
    <div class="wheel-members-card">
      <div class="wheel-members-title">
        <span>Deelnemers</span>
        <button class="wheel-toggle-all" onclick="toggleAllWiel()">Alles aan/uit</button>
      </div>
      <div class="wheel-grid" id="wheel-grid"></div>
      <div class="wheel-count" id="wheel-count"></div>
    </div>
  </div>`;
  buildWielGrid(namen);
  drawWiel();
}
function buildWielGrid(namen) {
  const g = document.getElementById('wheel-grid');
  if (!g) return;
  g.innerHTML = namen.map(n =>
    `<div class="wheel-chip ${wheelSelected.has(n)?'active':''}" onclick="toggleWielLid('${n}')" data-naam="${n}">
      <div class="chip-dot"></div>${n.split(' ')[0]}
    </div>`
  ).join('');
  updateWielCount();
}
function toggleWielLid(naam) {
  if (wheelSelected.has(naam)) { if(wheelSelected.size<=2)return; wheelSelected.delete(naam); }
  else wheelSelected.add(naam);
  const c = document.querySelector(`.wheel-chip[data-naam="${naam}"]`);
  if (c) c.classList.toggle('active', wheelSelected.has(naam));
  updateWielCount(); drawWiel();
}
function toggleAllWiel() {
  const namen = [...document.querySelectorAll('.wheel-chip')].map(c=>c.dataset.naam);
  const allOn = namen.every(n=>wheelSelected.has(n));
  namen.forEach(n=>allOn?wheelSelected.delete(n):wheelSelected.add(n));
  if(wheelSelected.size<2)namen.slice(0,2).forEach(n=>wheelSelected.add(n));
  namen.forEach(n=>{const c=document.querySelector(`.wheel-chip[data-naam="${n}"]`);if(c)c.classList.toggle('active',wheelSelected.has(n));});
  updateWielCount(); drawWiel();
}
function updateWielCount() {
  const el = document.getElementById('wheel-count');
  if (el) el.textContent = `${wheelSelected.size} deelnemers actief`;
}
function drawWiel(hi=-1) {
  const cv=document.getElementById('wheelCanvas');
  if(!cv)return;
  const ctx=cv.getContext('2d'),dl=[...wheelSelected],n=dl.length;
  if(!n)return;
  const cx=150,cy=150,r=144,sa=(2*Math.PI)/n;
  ctx.clearRect(0,0,300,300);
  dl.forEach((naam,i)=>{
    const s=wheelAngle+i*sa-Math.PI/2,e=s+sa,isH=i===hi;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,isH?r+6:r,s,e);ctx.closePath();
    ctx.fillStyle=WK[i%WK.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s+sa/2);
    ctx.textAlign='right';ctx.fillStyle='#fff';
    ctx.font=`bold ${n>16?9:n>10?11:13}px Jost,sans-serif`;
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=3;
    ctx.fillText(naam.split(' ')[0],r-10,4);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,28,0,2*Math.PI);
  ctx.fillStyle='#fff';ctx.fill();
  ctx.strokeStyle='rgba(26,26,64,.12)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#1a1a40';ctx.font='bold 11px Jost,sans-serif';ctx.textAlign='center';
  ctx.fillText('✦',cx,cy+4);
}
function spinWiel() {
  if(wheelSpinning)return;
  const dl=[...wheelSelected];
  if(dl.length<2)return;
  wheelSpinning=true;
  document.getElementById('wheel-result').innerHTML='';
  document.getElementById('wheel-spin-btn').disabled=true;
  const tot=(8+Math.random()*8)*Math.PI*2,dur=4000+Math.random()*1500;
  const t0=performance.now(),a0=wheelAngle;
  const ease=t=>1-Math.pow(1-t,4);
  function frame(now){
    const p=Math.min((now-t0)/dur,1);
    wheelAngle=a0+tot*ease(p);drawWiel();
    if(p<1){requestAnimationFrame(frame);return;}
    const sa=(2*Math.PI)/dl.length;
    const norm=((-wheelAngle%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    const wi=Math.floor(norm/sa)%dl.length;
    drawWiel(wi);
    document.getElementById('wheel-result').innerHTML=`🎉 <span>${dl[wi]}</span>`;
    document.getElementById('wheel-spin-btn').disabled=false;
    wheelSpinning=false;
  }
  requestAnimationFrame(frame);
}

// ============================================================
// DATA FETCH
// ============================================================
async function fetchData() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const raw = await res.json();
    cachedData = (raw.scores && !raw.lustrumweek)
      ? {lastUpdated:raw.lastUpdated,lustrumweek:{scores:raw.scores,activities:raw.activities||[]},jachtseizoen:{scores:[],activities:[]},bakrecord:{records:[]},geschiedenis:[]}
      : raw;
    await loadAllPfps();
    document.getElementById('lastUpdated').textContent = 'Bijgewerkt om ' + fmt(cachedData.lastUpdated);
    renderActiveTab();
  } catch(e) {
    ['lustrumweek','jachtseizoen','bakrecord','grafiek'].forEach(t=>{
      const el=document.getElementById('tab-'+t);
      if(el)el.innerHTML=`<div class="state-msg">❌ Kan data niet ophalen.
        <button class="refresh-btn" style="display:block;margin:16px auto 0" onclick="fetchData()">Probeer opnieuw</button>
      </div>`;
    });
  }
}

async function loadAllPfps() {
  const namen = new Set([
    ...(cachedData?.lustrumweek?.scores  || []),
    ...(cachedData?.jachtseizoen?.scores || [])
  ].map(p=>p.name));
  const toLoad = [...namen].filter(n=>!pfpCache[n]);
  if(!toLoad.length)return;
  await Promise.allSettled(toLoad.map(async naam=>{
    try {
      const res = await fetch(`${APPS_SCRIPT_URL}?action=profielfoto&naam=${encodeURIComponent(naam)}`);
      const d   = await res.json();
      if(d.url) pfpCache[naam]=d.url;
    } catch{}
  }));
}

setInterval(fetchData, 30000);
fetchData();
renderProgramma();
</script>
